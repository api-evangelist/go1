aid: go1
name: Go1
description: >-
  Go1 is an AI-powered corporate learning and development (L&D) platform that consolidates employee
  training into a single subscription. Its content library aggregates courses from 250+ providers
  across 40+ languages, layered with curation, skill-based learning paths, reporting and the Morgan
  by Go1 learning agent, and connects to existing HR and business systems through 75+ integrations.
  The Go1 developer platform exposes a date-versioned REST API (gateway.go1.com, Api-Version header)
  for discovering learning objects, managing enrollments, provisioning customer portals and
  subscribing to events via webhooks, secured with OAuth 2.0, plus JavaScript/React embedding SDKs
  and a webhook-verifier library. Go1 is backed by SoftBank Vision Fund and Y Combinator.
