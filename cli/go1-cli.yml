description: Go1 API management CLI that generates APIM deployment files from an OpenAPI document.
purpose: API management / deployment file generation from OpenAPI
note: First-party CLI published under the @go1 npm scope. It is a build/deploy tool for API management, not a general
  API-call CLI.
