commands:
- name: init
  usage: '@go1/apim-cli init [OPTION]'
  description: Create a new apim directory (wizard); options openapi, name, path, backend.
- name: update
  usage: '@go1/apim-cli update'
  description: Update an existing apim directory without re-running the wizard.
- name: validate
  usage: '@go1/apim-cli validate <openapi.yml> [OPTION]'
  description: Validate an OpenAPI doc against the standard schema; optional --master to detect breaking changes, --skip
