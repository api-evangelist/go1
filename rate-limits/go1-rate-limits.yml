limits:
- name: v2 List learning objects
  limit_text: The rate limit is a maximum of 4,000 requests within a 10-second timeframe, equivalent to 400 requests
    per second.
  max: 4000
  window: 10 seconds
  endpoint: v2 List learning objects
  scope: endpoint
  penalty: Exceeding this limit will result in a 10-second timeout.
note: In the future, we may expand the rate limit coverage across the API. Any additional rate limits will be communicated
