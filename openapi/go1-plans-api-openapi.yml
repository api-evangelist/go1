servers:
- url: https://gateway.go1.com
  description: Go1 API gateway (stated as the Base URL in the API reference overview)
tags:
- name: Plans
  description: 'The Plans resource represents a customer''s subscription plan to Go1, containing details such as the customer’s product tier, term duration, and license count. It manages customer access to Go1 products and facilitates the customer lifecycle, such as transitions between plan upgrades, downgrades, and renewals.


    The Plans API allows Go1 partners who provision and distribute Go1 products to their customer Portals, to create, retrieve, update, and manage plans for their customers. It is essential for the provisioning and management of a customer''s access to Go1.'
  x-source: https://developers.go1.com/api/rest/2025-01-01/plans/
paths:
  /portals/{id}/plans:
    get:
      description: Returns a list of plans associated with a specified portal. Use a customer portal ID to retrieve plans for that particular portal, or use your partner portal ID to retrieve plans across all customer portals.
      operationId: getPlans
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: A limit on the number of objects to be returned, between 1 and 100. The default is 20.
        schema:
          default: 20
          example: 10
          type: number
      - name: offset
        required: false
        in: query
        description: For use in pagination. The item number within a List request to start displaying results after. For example, if you make a request with limit=20 and offset=20, items 21 - 40 are returned.
        schema:
          minimum: 0
          default: 0
          example: 0
          type: number
      - name: portal_ids[]
        required: false
        in: query
        description: Filter results by a specific set of customer portals. This parameter can only be used when the request path includes your partner portal ID, allowing you to retrieve plans for selected customer portals.
        schema:
          default: []
          example:
          - '12345'
          type: array
          items:
            type: string
      - name: status[]
        required: false
        in: query
        description: Filter by the status of the plan. Available options are active, expired, cancelled, pending.
        schema:
          example:
          - active
          type: array
          items:
            type: string
            enum:
            - active
            - expired
            - cancelled
            - pending
      responses:
        '200':
          description: List of plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                    description: The total number of retrievable results from the request.
                    example: 100
                  hits:
                    description: An array containing the requested results.
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: pln_01DRBZ0CR06CWKGDHR6WTKADHG
                          description: The id of the plan.
                        portal_id:
                          type: string
                          example: '36184809'
                          description: The Go1 portal id which the plan was created for.
                        status:
                          enum:
                          - active
                          - expired
                          - cancelled
                          - pending
                          type: string
                          example: active
                          description: "The current state of the plan.\n  - active: The plan is currently within the term dates and is available.\n  - expired: The plan has naturally reached its end date.\n  - cancelled: The plan has been manually cancelled.\n  - pending: The plan has not yet started; the start date is in the future."
                        start_time:
                          type: string
                          format: date-time
                          example: '2022-03-29T01:29:36.000Z'
                          description: The start time of the plan (ISO 8601 in UTC), when the plan will become active and access is given.
                        end_time:
                          type: string
                          format: date-time
                          example: '2022-03-29T01:29:36.000Z'
                          description: The end time of the plan (ISO 8601 in UTC), when the plan will renew or expire.
                        created_time:
                          type: string
                          format: date-time
                          example: '2022-03-29T01:29:36.000Z'
                          description: The timestamp when the plan was created (ISO 8601 in UTC).
                        updated_time:
                          type: string
                          format: date-time
                          example: '2022-03-29T01:29:36.000Z'
                          description: The timestamp when the plan was last updated  (ISO 8601 in UTC).
                        auto_renew:
                          type: boolean
                          example: true
                          description: Whether this plan will automatically renew at the end of the term.
                        renewal_term:
                          description: The details of renewal term. If auto_renew is false, then this field will be null
                          allOf:
                          - type: object
                            properties:
                              value:
                                type: number
                                description: The numerical value of the duration.
                                example: 6
                              unit:
                                description: The unit of time for the duration. Available values are "months".
                                example: months
                                enum:
                                - months
                                - days
                                type: string
                            required:
                            - value
                            - unit
                        term:
                          description: The duration of the plan.
                          allOf:
                          - type: object
                            properties:
                              value:
                                type: number
                                description: The numerical value of the duration.
                                example: 6
                              unit:
                                description: The unit of time for the duration. Available values are "months".
                                example: months
                                enum:
                                - months
                                - days
                                type: string
                            required:
                            - value
                            - unit
                        entitlements:
                          description: The details of the products this plan is entitled to.
                          type: array
                          items:
                            type: object
                            properties:
                              product_key:
                                type: string
                                example: pk_22ZHBZ0CR00CWKGDHR6WTKADAU
                                description: The key which represents the product associated with the plan.
                              variant_key:
                                type: string
                                example: vk_22ZHBZ0CR00CWKGDHR6WTKADAU
                                description: The key which represents the variant associated with the plan.
                              status:
                                enum:
                                - active
                                - cancelled
                                type: string
                                example: active
                                description: The current state of the plan.
                              license_count:
                                type: number
                                example: 36184809
                                description: The number of user licenses included in the plan.
                              created_time:
                                type: string
                                format: date-time
                                example: '2022-03-29T01:29:36.000Z'
                                description: The timestamp when the plan was created (ISO 8601 in UTC).
                              updated_time:
                                type: string
                                format: date-time
                                example: '2022-03-29T01:29:36.000Z'
                                description: The timestamp when the plan was last updated  (ISO 8601 in UTC).
                            required:
                            - product_key
                            - status
                            - license_count
                            - created_time
                            - updated_time
                      required:
                      - id
                      - portal_id
                      - status
                      - start_time
                      - end_time
                      - created_time
                      - updated_time
                      - auto_renew
                      - term
                required:
                - total
                - hits
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_code:
                    type: string
                    readOnly: true
                    enum:
                    - AUTH_TOKEN_MISSING
                    - AUTH_TOKEN_INVALID
                    - AUTH_INVALID_JWT
                    - AUTH_INVALID_JWT_SUB_MISSING
                    - AUTH_NOT_GRANTED_BY_USED_CREDENTIALS
                    - USER_INVALID_PORTAL_ID
                    - GET_CHILD_FAILED
                    - NO_ACCESS_TO_PORTAL
                    - PERMISSION_INVALID_ADMIN_REQUIRED
                    - PERMISSION_INVALID_ACCOUNT_ROLE
                    - INVALID_REQUEST
                    - PORTAL_NOT_FOUND
                    - PLAN_NOT_FOUND
                    - PLAN_ALREADY_CANCELLED
                    - PLAN_PAST_START_DATE
                    - PRODUCT_NOT_FOUND
                    - ACTIVE_PLAN_ALREADY_EXISTS
                    - INTERNAL_SERVER_ERROR
                    - PLAN_SCHEDULE_NOT_FOUND
                    - PLAN_HISTORY_NOT_FOUND
                    - PLAN_NOT_TRIAL
                    - PLAN_NOT_EXPIRED
                    - EXTENSION_WINDOW_CLOSED
                    - EXTENSION_ALREADY_USED
                  message:
                    type: string
                    readOnly: true
                required:
                - error_code
                - message
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_code:
                    type: string
                    readOnly: true
                    enum:
                    - AUTH_TOKEN_MISSING
                    - AUTH_TOKEN_INVALID
                    - AUTH_INVALID_JWT
                    - AUTH_INVALID_JWT_SUB_MISSING
                    - AUTH_NOT_GRANTED_BY_USED_CREDENTIALS
                    - USER_INVALID_PORTAL_ID
                    - GET_CHILD_FAILED
                    - NO_ACCESS_TO_PORTAL
                    - PERMISSION_INVALID_ADMIN_REQUIRED
                    - PERMISSION_INVALID_ACCOUNT_ROLE
                    - INVALID_REQUEST
                    - PORTAL_NOT_FOUND
                    - PLAN_NOT_FOUND
                    - PLAN_ALREADY_CANCELLED
                    - PLAN_PAST_START_DATE
                    - PRODUCT_NOT_FOUND
                    - ACTIVE_PLAN_ALREADY_EXISTS
                    - INTERNAL_SERVER_ERROR
                    - PLAN_SCHEDULE_NOT_FOUND
                    - PLAN_HISTORY_NOT_FOUND
                    - PLAN_NOT_TRIAL
                    - PLAN_NOT_EXPIRED
                    - EXTENSION_WINDOW_CLOSED
                    - EXTENSION_ALREADY_USED
                  message:
                    type: string
                    readOnly: true
                required:
                - error_code
                - message
              examples:
                PERMISSION_INVALID_ADMIN_REQUIRED:
                  value:
                    error_code: PERMISSION_INVALID_ADMIN_REQUIRED
                    message: User must be an admin to perform this action.
      security:
      - OAuth2:
        - plan.read
      summary: List all plans
      tags:
      - Plans
    post:
      description: Creates a new plan.
      operationId: createPlan
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                auto_renew:
                  type: boolean
                  description: Whether the plan will automatically be renewed at the end of its term.
                  example: true
                start_time:
                  type: string
                  description: 'The start date of the plan (ISO 8601 in UTC), when the plan will become active and access is given.

                    If this parameter is not provided, the start date will default to the current time.'
                  example: '2022-01-01T00:00:00.000Z'
                term:
                  description: 'The duration of the plan.

                    If this field is not provided, the term will default to 12 months.'
                  allOf:
                  - type: object
                    properties:
                      value:
                        type: number
                        description: The numerical value of the duration.
                        example: 6
                      unit:
                        description: The unit of time for the duration. Available values are "months".
                        example: months
                        enum:
                        - months
                        - days
                        type: string
                    required:
                    - value
                    - unit
                renewal_term:
                  description: 'The duration of the renewal plan.

                    If this field is not provided and auto_renew is true, then the term of the renewed plan is the same length as the original plan.'
                  allOf:
                  - type: object
                    properties:
                      value:
                        type: number
                        description: The numerical value of the duration.
                        example: 6
                      unit:
                        description: The unit of time for the duration. Available values are "months".
                        example: months
                        enum:
                        - months
                        - days
                        type: string
                    required:
                    - value
                    - unit
                enable_early_access:
                  type: boolean
                  description: 'Enable early access to provision content immediately, regardless of the plan start date.

                    When enabled, content will be made available right away even if the `start_time` is set to a future date.

                    Note: If enabled, the `start_time` must be within 365 days from the current date.'
                  example: false
              required:
              - term
      responses:
        '201':
          description: Plan created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: pln_01DRBZ0CR06CWKGDHR6WTKADHG
                    description: The id of the plan.
                  portal_id:
                    type: string
                    example: '36184809'
                    description: The Go1 portal id which the plan was created for.
                  status:
                    enum:
                    - active
                    - expired
                    - cancelled
                    - pending
                    type: string
                    example: active
                    description: "The current state of the plan.\n  - active: The plan is currently within the term dates and is available.\n  - expired: The plan has naturally reached its end date.\n  - cancelled: The plan has been manually cancelled.\n  - pending: The plan has not yet started; the start date is in the future."
                  start_time:
                    type: string
                    format: date-time
                    example: '2022-03-29T01:29:36.000Z'
                    description: The start time of the plan (ISO 8601 in UTC), when the plan will become active and access is given.
                  end_time:
                    type: string
                    format: date-time
                    example: '2022-03-29T01:29:36.000Z'
                    description: The end time of the plan (ISO 8601 in UTC), when the plan will renew or expire.
                  created_time:
                    type: string
                    format: date-time
                    example: '2022-03-29T01:29:36.000Z'
                    description: The timestamp when the plan was created (ISO 8601 in UTC).
                  updated_time:
                    type: string
                    format: date-time
                    example: '2022-03-29T01:29:36.000Z'
                    description: The timestamp when the plan was last updated  (ISO 8601 in UTC).
                  auto_renew:
                    type: boolean
                    example: true
                    description: Whether this plan will automatically renew at the end of the term.
                  renewal_term:
                    description: The details of renewal term. If auto_renew is false, then this field will be null
                    allOf:
                    - type: object
                      properties:
                        value:
                          type: number
                          description: The numerical value of the duration.
                          example: 6
                        unit:
                          description: The unit of time for the duration. Available values are "months".
                          example: months
                          enum:
                          - months
                          - days
                          type: string
                      required:
                      - value
                      - unit
                  term:
                    description: The duration of the plan.
                    allOf:
                    - type: object
                      properties:
                        value:
                          type: number
                          description: The numerical value of the duration.
                          example: 6
                        unit:
                          description: The unit of time for the duration. Available values are "months".
                          example: months
                          enum:
                          - months
                          - days
                          type: string
                      required:
                      - value
                      - unit
                  entitlements:
                    example: []
                    description: The details of the products this plan is entitled to.
                    type: array
                    items:
                      type: object
                      properties:
                        product_key:
                          type: string
                          example: pk_22ZHBZ0CR00CWKGDHR6WTKADAU
                          description: The key which represents the product associated with the plan.
                        variant_key:
                          type: string
                          example: vk_22ZHBZ0CR00CWKGDHR6WTKADAU
                          description: The key which represents the variant associated with the plan.
                        status:
                          enum:
                          - active
                          - cancelled
                          type: string
                          example: active
                          description: The current state of the plan.
                        license_count:
                          type: number
                          example: 36184809
                          description: The number of user licenses included in the plan.
                        created_time:
                          type: string
                          format: date-time
                          example: '2022-03-29T01:29:36.000Z'
                          description: The timestamp when the plan was created (ISO 8601 in UTC).
                        updated_time:
                          type: string
                          format: date-time
                          example: '2022-03-29T01:29:36.000Z'
                          description: The timestamp when the plan was last updated  (ISO 8601 in UTC).
                      required:
                      - product_key
                      - status
                      - license_count
                      - created_time
                      - updated_time
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_code:
                    type: string
                    readOnly: true
                    enum:
                    - AUTH_TOKEN_MISSING
                    - AUTH_TOKEN_INVALID
                    - AUTH_INVALID_JWT
                    - AUTH_INVALID_JWT_SUB_MISSING
                    - AUTH_NOT_GRANTED_BY_USED_CREDENTIALS
                    - USER_INVALID_PORTAL_ID
                    - GET_CHILD_FAILED
                    - NO_ACCESS_TO_PORTAL
                    - PERMISSION_INVALID_ADMIN_REQUIRED
                    - PERMISSION_INVALID_ACCOUNT_ROLE
                    - INVALID_REQUEST
                    - PORTAL_NOT_FOUND
                    - PLAN_NOT_FOUND
                    - PLAN_ALREADY_CANCELLED
                    - PLAN_PAST_START_DATE
                    - PRODUCT_NOT_FOUND
                    - ACTIVE_PLAN_ALREADY_EXISTS
                    - INTERNAL_SERVER_ERROR
                    - PLAN_SCHEDULE_NOT_FOUND
                    - PLAN_HISTORY_NOT_FOUND
                    - PLAN_NOT_TRIAL
                    - PLAN_NOT_EXPIRED
                    - EXTENSION_WINDOW_CLOSED
                    - EXTENSION_ALREADY_USED
                  message:
                    type: string
                    readOnly: true
                required:
                - error_code
                - message
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_code:
                    type: string
                    readOnly: true
                    enum:
                    - AUTH_TOKEN_MISSING
                    - AUTH_TOKEN_INVALID
                    - AUTH_INVALID_JWT
                    - AUTH_INVALID_JWT_SUB_MISSING
                    - AUTH_NOT_GRANTED_BY_USED_CREDENTIALS
                    - USER_INVALID_PORTAL_ID
                    - GET_CHILD_FAILED
                    - NO_ACCESS_TO_PORTAL
                    - PERMISSION_INVALID_ADMIN_REQUIRED
                    - PERMISSION_INVALID_ACCOUNT_ROLE
                    - INVALID_REQUEST
                    - PORTAL_NOT_FOUND
                    - PLAN_NOT_FOUND
                    - PLAN_ALREADY_CANCELLED
                    - PLAN_PAST_START_DATE
                    - PRODUCT_NOT_FOUND
                    - ACTIVE_PLAN_ALREADY_EXISTS
                    - INTERNAL_SERVER_ERROR
                    - PLAN_SCHEDULE_NOT_FOUND
                    - PLAN_HISTORY_NOT_FOUND
                    - PLAN_NOT_TRIAL
                    - PLAN_NOT_EXPIRED
                    - EXTENSION_WINDOW_CLOSED
                    - EXTENSION_ALREADY_USED
                  message:
                    type: string
                    readOnly: true
                required:
                - error_code
                - message
              examples:
                PERMISSION_INVALID_ADMIN_REQUIRED:
                  value:
                    error_code: PERMISSION_INVALID_ADMIN_REQUIRED
                    message: User must be an admin to perform this action.
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_code:
                    type: string
                    readOnly: true
                    enum:
                    - AUTH_TOKEN_MISSING
                    - AUTH_TOKEN_INVALID
                    - AUTH_INVALID_JWT
                    - AUTH_INVALID_JWT_SUB_MISSING
                    - AUTH_NOT_GRANTED_BY_USED_CREDENTIALS
                    - USER_INVALID_PORTAL_ID
                    - GET_CHILD_FAILED
                    - NO_ACCESS_TO_PORTAL
                    - PERMISSION_INVALID_ADMIN_REQUIRED
                    - PERMISSION_INVALID_ACCOUNT_ROLE
                    - INVALID_REQUEST
                    - PORTAL_NOT_FOUND
                    - PLAN_NOT_FOUND
                    - PLAN_ALREADY_CANCELLED
                    - PLAN_PAST_START_DATE
                    - PRODUCT_NOT_FOUND
                    - ACTIVE_PLAN_ALREADY_EXISTS
                    - INTERNAL_SERVER_ERROR
                    - PLAN_SCHEDULE_NOT_FOUND
                    - PLAN_HISTORY_NOT_FOUND
                    - PLAN_NOT_TRIAL
                    - PLAN_NOT_EXPIRED
                    - EXTENSION_WINDOW_CLOSED
