  /portals/{portal_id}/plans/{plan_id}/entitlements:
    patch:
      description: Updates the entitlements linked to a plan.
      operationId: updatePlanEntitlements
      parameters:
      - name: portal_id
        required: true
        in: path
        schema:
          type: string
      - name: plan_id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entitlements:
                  description: The details of the products this plan is entitled to.
                  example:
                  - product_key: pk_22ZHBZ0CR00CWKGDHR6WTKADAU
                    variant_key: vk_22ZHBZ0CR00CWKGDHR6WTKADAU
                    license_count: 100
                  - product_key: pk_08GRBZ0CR07CWKGDHR6WTKADUZ
                    license_count: 10
                  type: array
                  items:
                    type: object
                    properties:
                      product_key:
                        type: string
                        example: pk_22ZHBZ0CR00CWKGDHR6WTKADAU
                        description: The key which represents the product associated with the plan.
                      variant_key:
                        type: string
                        example: vk_22ZHBZ0CR00CWKGDHR6WTKADAU
                        description: The key representing the variant which the entitlement will be provisioned with.
                      license_count:
                        type: number
                        example: 100
                        description: The number of user licenses included in the plan.
                    required:
                    - product_key
                    - license_count
              required:
              - entitlements
      responses:
        '202':
          description: Plan entitlements updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  entitlements:
                    description: The details of the products this plan is entitled to.
                    type: array
                    items:
                      type: object
                      properties:
                        product_key:
                          type: string
                          example: pk_22ZHBZ0CR00CWKGDHR6WTKADAU
                          description: The key which represents the product associated with the plan.
                        variant_key:
                          type: string
                          example: vk_22ZHBZ0CR00CWKGDHR6WTKADAU
                          description: The key which represents the variant associated with the plan.
                        status:
                          enum:
                          - active
                          - cancelled
                          type: string
                          example: active
                          description: The current state of the plan.
                        license_count:
                          type: number
                          example: 36184809
                          description: The number of user licenses included in the plan.
                        created_time:
                          type: string
                          format: date-time
                          example: '2022-03-29T01:29:36.000Z'
                          description: The timestamp when the plan was created (ISO 8601 in UTC).
                        updated_time:
                          type: string
                          format: date-time
                          example: '2022-03-29T01:29:36.000Z'
                          description: The timestamp when the plan was last updated  (ISO 8601 in UTC).
                      required:
                      - product_key
                      - status
                      - license_count
                      - created_time
                      - updated_time
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_code:
                    type: string
                    readOnly: true
                    enum:
                    - AUTH_TOKEN_MISSING
                    - AUTH_TOKEN_INVALID
                    - AUTH_INVALID_JWT
                    - AUTH_INVALID_JWT_SUB_MISSING
                    - AUTH_NOT_GRANTED_BY_USED_CREDENTIALS
