  /portals/{id}/plans/{plan_id}:
    patch:
      description: Updates a plan
      operationId: patchPlan
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      - name: plan_id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                auto_renew:
                  type: boolean
                  description: Whether the plan will automatically be renewed at the end of its term.
                  example: true
                start_time:
                  type: string
                  description: 'The start date of the plan (ISO 8601 in UTC), when the plan will become active and access is given.

                    If this parameter is not provided, the start date will default to the current time.'
                  example: '2022-01-01T00:00:00.000Z'
                term:
                  description: 'The duration of the plan.

                    If this field is not provided, the term will default to 12 months.'
                  allOf:
                  - type: object
                    properties:
                      value:
                        type: number
                        description: The numerical value of the duration.
                        example: 6
                      unit:
                        description: The unit of time for the duration. Available values are "months".
                        example: months
                        enum:
                        - months
                        - days
                        type: string
                    required:
                    - value
                    - unit
                renewal_term:
                  description: 'The duration of the plan.

                    If this field is not provided and auto_renew is true, then the term of the renewed plan is the same length as the original plan.'
                  allOf:
                  - type: object
                    properties:
                      value:
                        type: number
                        description: The numerical value of the duration.
                        example: 6
                      unit:
                        description: The unit of time for the duration. Available values are "months".
                        example: months
                        enum:
                        - months
                        - days
                        type: string
                    required:
                    - value
                    - unit
              required:
              - term
      responses:
        '200':
          description: Plan updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: pln_01DRBZ0CR06CWKGDHR6WTKADHG
                    description: The id of the plan.
                  portal_id:
                    type: string
                    example: '36184809'
                    description: The Go1 portal id which the plan was created for.
                  status:
                    enum:
                    - active
                    - expired
                    - cancelled
                    - pending
                    type: string
                    example: active
                    description: "The current state of the plan.\n  - active: The plan is currently within the term dates and is available.\n  - expired: The plan has naturally reached its end date.\n  - cancelled: The plan has been manually cancelled.\n  - pending: The plan has not yet started; the start date is in the future."
                  start_time:
                    type: string
                    format: date-time
                    example: '2022-03-29T01:29:36.000Z'
                    description: The start time of the plan (ISO 8601 in UTC), when the plan will become active and access is given.
                  end_time:
                    type: string
                    format: date-time
                    example: '2022-03-29T01:29:36.000Z'
                    description: The end time of the plan (ISO 8601 in UTC), when the plan will renew or expire.
                  created_time:
                    type: string
                    format: date-time
                    example: '2022-03-29T01:29:36.000Z'
                    description: The timestamp when the plan was created (ISO 8601 in UTC).
                  updated_time:
                    type: string
                    format: date-time
                    example: '2022-03-29T01:29:36.000Z'
                    description: The timestamp when the plan was last updated  (ISO 8601 in UTC).
                  auto_renew:
                    type: boolean
                    example: true
                    description: Whether this plan will automatically renew at the end of the term.
                  renewal_term:
                    description: The details of renewal term. If auto_renew is false, then this field will be null
                    allOf:
                    - type: object
                      properties:
                        value:
                          type: number
                          description: The numerical value of the duration.
                          example: 6
                        unit:
                          description: The unit of time for the duration. Available values are "months".
                          example: months
                          enum:
                          - months
                          - days
                          type: string
                      required:
                      - value
                      - unit
                  term:
                    description: The duration of the plan.
                    allOf:
                    - type: object
                      properties:
                        value:
                          type: number
                          description: The numerical value of the duration.
                          example: 6
                        unit:
                          description: The unit of time for the duration. Available values are "months".
                          example: months
                          enum:
                          - months
                          - days
                          type: string
                      required:
                      - value
                      - unit
                  entitlements:
                    description: The details of the products this plan is entitled to.
                    type: array
                    items:
                      type: object
                      properties:
                        product_key:
                          type: string
                          example: pk_22ZHBZ0CR00CWKGDHR6WTKADAU
                          description: The key which represents the product associated with the plan.
                        variant_key:
                          type: string
                          example: vk_22ZHBZ0CR00CWKGDHR6WTKADAU
                          description: The key which represents the variant associated with the plan.
                        status:
                          enum:
                          - active
                          - cancelled
                          type: string
                          example: active
                          description: The current state of the plan.
                        license_count:
                          type: number
                          example: 36184809
                          description: The number of user licenses included in the plan.
                        created_time:
                          type: string
                          format: date-time
                          example: '2022-03-29T01:29:36.000Z'
                          description: The timestamp when the plan was created (ISO 8601 in UTC).
                        updated_time:
                          type: string
                          format: date-time
                          example: '2022-03-29T01:29:36.000Z'
                          description: The timestamp when the plan was last updated  (ISO 8601 in UTC).
                      required:
                      - product_key
                      - status
                      - license_count
                      - created_time
                      - updated_time
                required:
                - id
                - portal_id
                - status
                - start_time
                - end_time
                - created_time
                - updated_time
                - auto_renew
                - term
