  x-assembled: '2026-10-21'
servers:
- url: https://gateway.go1.com
  description: Go1 API gateway (stated as the Base URL in the API reference overview)
tags:
- name: Collections
  description: Collections provide a means to curate learning objects into subset groups. Currently, our system only supports a primary collection known as the `Library` collection. This collection is designed specifically for the management of customer-specific content libraries. Admins leverage the Library collection to seamlessly add, remove, and synchronize content within the Library, ensuring seamless integration with external systems.
  x-source: https://developers.go1.com/api/rest/2025-01-01/collections/
paths:
  /collections/library/delta:
    get:
      security:
      - OAuth2:
        - portal.read
      operationId: CollectionDeltaController_browseCollectionsDeltas
      summary: List collection changes
      description: Retrieves a list of learning objects that have been modified, added, removed, or decommissioned in a collection in a given date range.
      parameters:
      - name: start_time
        required: true
        in: query
        example: '2022-09-01T01:29:36Z'
        description: Returns collection changes with a timestamp that is greater than or equal to a given value, eg. `start_time=2022-09-01T01:29:36Z` or `start_time=2022-09-01`. Date time format is ISO 8601 in UTC. Both YYYY-MM-DD and YYYY-MM-DDThh:mm:ssZ formats are supported.
        schema:
          type: string
      - name: end_time
        required: true
        in: query
        example: '2022-10-13T04:00:00Z'
        description: Returns collection changes with a timestamp that is less than or equal to a given value, eg. `end_time=2022-10-13T04:00:00Z` or `end_time=2022-10-13`. Date time format is ISO 8601 in UTC. Both YYYY-MM-DD and YYYY-MM-DDThh:mm:ssZ formats are supported.
        schema:
          type: string
      - name: collection
        required: false
        in: query
        example: partner_content
        description: Collection to retrieve changes for. Defaults to `default`.
        schema:
          type: string
          enum:
          - default
          - partner_content
      responses:
        '200':
          description: Returns all learning object IDs that had changed in a library.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                    description: Total number of learning objects that have changed in a collection.
                    example: 9
                  lo_ids:
                    description: Learning object IDs that have changed in a collection.
                    type: object
                    properties:
                      added:
                        type: array
                        items:
                          type: string
                        description: The array of learning objects IDs added to the collection.
                        example:
                        - '1'
                        - '2'
                        - '3'
                      updated:
                        type: array
                        items:
                          type: string
                        description: The array of learning objects IDs updated in the collection.
                        example:
                        - '3'
                        - '4'
                      removed:
                        type: array
                        items:
                          type: string
                        description: The array of learning objects IDs removed from the collection.
                        example:
                        - '5'
                        - '6'
                        - '7'
                      decommissioned:
                        type: array
                        items:
                          type: string
                        description: The array of learning objects IDs decommissioned.
                        example:
                        - '8'
                        - '9'
                    required:
                    - added
                    - updated
                    - removed
                    - decommissioned
                required:
                - total
                - lo_ids
        '400':
          description: Invalid parameters provided.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    message:
                      type: string
                      example: Invalid date range provided, please ensure the start_time and end_time are correct.
                    error_code:
                      type: string
                      example: COLLECTIONS_DATE_RANGE_INVALID
                - type: object
                  properties:
                    message:
                      type: string
                      example: Invalid date range provided, please ensure the end_time is not in the future.
                    error_code:
                      type: string
                      example: COLLECTIONS_DATE_VALUE_EXCEED_VALID
                - type: object
                  properties:
                    message:
                      type: string
                      example: start_time must be a valid ISO 8601 date string.
                    error_code:
                      type: string
                      example: COLLECTIONS_INVALID_REQUEST
        '401':
          description: User is unauthenticated.
        '403':
          description: User is not authorized.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    message:
                      type: string
                      example: Insufficient roles for this resource.
                    error_code:
                      type: string
                      example: COLLECTIONS_AUTH_INSUFFICIENT_PERMISSIONS
                - type: object
                  properties:
                    message:
                      type: string
                      example: User is not authorized.
                    error_code:
                      type: string
                      example: COLLECTIONS_USER_UNAUTHENTICATED
        '500':
          description: Collection's library error.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    message:
                      type: string
                      example: Failed to retrieve portal's collections.
                    error_code:
                      type: string
                      example: COLLECTIONS_PORTAL_LIBRARY_ERROR
      tags:
      - Collections
  /collections/library/swap:
    post:
      description: Users can update the library by replacing existing learning objects with newly purchased or shared ones. This action will only succeed if the specified "add" and "remove" object IDs are valid, and the number of objects being added does not exceed the number being removed. Cannot add more learning objects than the portal content limit.
      operationId: swapContents
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                add:
                  items:
                    type: string
                  example:
                  - '36473761'
                  description: Selects Learning Objects to be added based on the IDs passed. A maximum of 100 IDs is allowed per request.
                  type: array
                remove:
                  items:
                    type: string
                  example:
                  - '36473762'
                  description: Selects Learning Objects to be removed based on the IDs passed. A maximum of 100 IDs is allowed per request.
                  type: array
              required:
              - add
              - remove
      responses:
        '204':
          description: ''
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_code:
                    type: string
                    description: The error code representing the type of error
                    enum:
                    - AUTH_TOKEN_MISSING
                    - AUTH_TOKEN_INVALID
                    - AUTH_INVALID_JWT
                    - INTERNAL_SERVER_ERROR
                    - UNABLE_TO_ISSUE_ACCESS_TOKEN
                    - INVALID_DOMAIN
                    - INVALID_REQUEST
                    - PORTAL_ACCESS_UNAUTHORIZED
                    - PORTAL_CREATE_UNAUTHORIZED
                    - FORBIDDEN
                    - PORTAL_NOT_FOUND
                    - PARTNER_PORTAL_NOT_FOUND
                    - PLAN_NOT_FOUND
                    - ENTITLEMENT_PRODUCT_KEY_NOT_FOUND
                    example: AUTH_TOKEN_MISSING
                  message:
                    type: string
                    description: A human-readable error message providing additional details
                    example: Invalid input provided.
                required:
                - error_code
                - message
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_code:
                    type: string
                    description: The error code representing the type of error
                    enum:
                    - AUTH_TOKEN_MISSING
                    - AUTH_TOKEN_INVALID
                    - AUTH_INVALID_JWT
                    - INTERNAL_SERVER_ERROR
                    - UNABLE_TO_ISSUE_ACCESS_TOKEN
                    - INVALID_DOMAIN
                    - INVALID_REQUEST
                    - PORTAL_ACCESS_UNAUTHORIZED
                    - PORTAL_CREATE_UNAUTHORIZED
                    - FORBIDDEN
                    - PORTAL_NOT_FOUND
                    - PARTNER_PORTAL_NOT_FOUND
                    - PLAN_NOT_FOUND
                    - ENTITLEMENT_PRODUCT_KEY_NOT_FOUND
                    example: AUTH_TOKEN_MISSING
                  message:
                    type: string
                    description: A human-readable error message providing additional details
                    example: Invalid input provided.
                required:
                - error_code
                - message
              examples:
                PORTAL_ACCESS_UNAUTHORIZED:
                  value:
                    error_code: PORTAL_ACCESS_UNAUTHORIZED
                    message: Insufficient permission to access portal.
      security:
      - OAuth2:
        - portal.write
      summary: Swap learning objects from Library
      tags:
      - Collections
