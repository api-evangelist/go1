    OAuth2:
      type: oauth2
      description: OAuth 2.0 via a Go1 Developer App (client_id/client_secret). See https://developers.go1.com/docs/developer-tools/auth/overview-auth
      flows:
        clientCredentials:
          tokenUrl: https://auth.go1.com/oauth/token
          scopes:
            enrollment.read: ''
            enrollment.write: ''
            group.read: ''
            group.write: ''
            lo.launch: ''
            lo.read: ''
            lo.write: ''
            plan.read: ''
            plan.write: ''
            portal.read: ''
            portal.write: ''
            user.login: ''
            user.read: ''
            user.write: ''
            webhook.read: ''
            webhook.write: ''
        authorizationCode:
          authorizationUrl: https://auth.go1.com/oauth/authorize
          tokenUrl: https://auth.go1.com/oauth/token
          scopes:
            enrollment.read: ''
            enrollment.write: ''
            group.read: ''
            group.write: ''
            lo.launch: ''
            lo.read: ''
            lo.write: ''
            plan.read: ''
            plan.write: ''
            portal.read: ''
            portal.write: ''
            user.login: ''
            user.read: ''
            user.write: ''
            webhook.read: ''
            webhook.write: ''
    bearer:
      type: http
      scheme: bearer
      description: Access token sent in the Authorization header (named "bearer" by some operations in the reference).
