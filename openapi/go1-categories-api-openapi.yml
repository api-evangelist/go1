servers:
- url: https://gateway.go1.com
  description: Go1 API gateway (stated as the Base URL in the API reference overview)
tags:
- name: Categories
  description: 'The Categories resource provides a structured taxonomy for organizing

    and discovering content within Go1. Categories can be applied to

    various resource types and support hierarchical relationships to

    create intuitive navigation and filtering experiences.


    This API allows you to retrieve category information from a portal.

    Use this endpoint to build navigation, filtering, and discovery

    features that align with your portal''s content structure.


    **Important notes:**

    - Categories are read-only via the API (creation/modification not

    supported)

    - Category structures may evolve over time—handle missing categories

    gracefully in your implementation'
  x-source: https://developers.go1.com/api/rest/2025-01-01/categories/
paths:
  /categories/{id}:
    get:
      operationId: CategoriesController_getCategory
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      - name: include[]
        required: false
        in: query
        description: Include additional related data. Only "descendants" is supported.
        schema:
          example:
          - descendants
          type: array
          items:
            type: string
            enum:
            - descendants
      responses:
        '200':
          description: The category and optionally its hierarchy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Unique identifier of the category
                    example: cat_01K4YDBGBBZZBXP2VJ4T12K3X4
                  name:
                    type: string
                    description: Human-readable name of the category
                    example: Artificial Iintelligence
                  parent_id:
                    type:
                    - string
                    - 'null'
                    description: Parent category ID
                    example: cat_01K568QVV2T4Q1F8H8A3D706EN
                  root_id:
                    type:
                    - string
                    - 'null'
                    description: Root category ID
                    example: cat_01K568QVV2T4Q1F8H8A3D706EN
                  children:
                    description: Child categories (included only if requested)
                    example:
                    - id: cat_01K4YDBGBBZZBXP2VJ4T12K3X4
                      name: AI for Data Security
                      children: []
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier of the category
                          example: cat_01K4YDBGBBZZBXP2VJ4T12K3X4
                        name:
                          type: string
                          description: Human-readable name of the category
                          example: Artificial Iintelligence
                        children:
                          description: Child categories (included only if requested)
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: Unique identifier of the category
                                example: cat_01K4YDBGBBZZBXP2VJ4T12K3X4
                              name:
                                type: string
                                description: Human-readable name of the category
                                example: Artificial Iintelligence
                              children:
                                description: Child categories (included only if requested)
                                type: array
                                items:
                                  type: object
                            required:
                            - id
                            - name
                      required:
                      - id
                      - name
                required:
                - id
                - name
      security:
      - OAuth2:
        - portal.read
      summary: Get category by id
      tags:
      - Categories
components:
