                        description: The user's phone number.
                      gender:
                        type: string
                        example: Male
                        description: The gender identity of the user.
                      industry:
                        type: string
                        example: Finance
                        description: The industry or sector to which the user's organization belongs.
                      department:
                        type: string
                        example: Investment
                        description: The department within an organization to which the user belongs.
                      division:
                        type: string
