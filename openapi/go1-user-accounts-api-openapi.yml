  /user-accounts/{id}:
    get:
      servers:
      - url: /accounts/{id}
        description: rewrite
      operationId: getUserAccount
      summary: Retrieve a user account
      description: Retrieves the details of a user account. User account id, as well as account_guid, a new unique identifier for the user account object can be used to fetch the account details.
      parameters:
      - name: id
        description: "Either Go1's ID or External ID.<br>\nIf it is an External ID then\n  * `identifier` query parameter must be provided as `external_id`.\n  * Example: `GET user-accounts/123456789?identifier=external_id`\n"
        required: true
        in: path
        schema:
          oneOf:
          - type: string
          - type: integer
        examples:
          go1_id:
            value: 12346
          external_id:
            value: '123456789'
      - name: identifier
        required: false
        in: query
        example: external_id
        description: "The `identifier` query parameter allows you to specify the identifier you would like to use when looking up a user account.\n\n\n  The available values are:\n\n\n- `external_id`: The API will consider the supplied {id} as the external ID, and will look up the user account that corresponds to the provided id."
        schema:
          enum:
          - external_id
          type: string
      - name: include[]
        required: false
        in: query
        description: "Returns extended information related to a user account.\nAvailable values:\n\n  - managers: Returns the associated managers for the user account.\n      * `include[]=managers`, returns user account(s) with managers.\n  - standard_fields: Returns the standard fields associated with the user account.\n      * `include[]=standard_fields.external_user_id&include[]=standard_fields.department`, returns user account(s) with standard_fields.external_user_id and standard_fields.department.\n  - additional_fields: Returns the additional fields associated with the user account.\n      * `include[]=additional_fields.colour`, returns user account(s) with additional_fields.colour.\n"
