openapi: 3.2.0
info:
  title: Go1 Files API
  version: '2025-01-01'
  description: Go1 REST API, version 2025-01-01, as published in the Go1 developer API reference. Every path operation is the provider's own OpenAPI operation object, copied verbatim from the endpoints data embedded in each reference page (__NEXT_DATA__ pageProps.endpoints) on developers.go1.com. The info, servers and securitySchemes envelope is assembled from the reference overview (base URL https://gateway.go1.com, Api-Version header) and the OAuth 2.0 grant guides (auth.go1.com token/authorize URLs); scope descriptions are left blank because the operations name scopes without describing them.
  contact:
    name: Go1 Developer Support
    url: https://developers.go1.com/
  x-assembled-from:
  - https://developers.go1.com/api/rest/2025-01-01/overview/
  - https://developers.go1.com/api/rest/2025-01-01/categories/
  - https://developers.go1.com/api/rest/2025-01-01/collections/
  - https://developers.go1.com/api/rest/2025-01-01/compliance/
  - https://developers.go1.com/api/rest/2025-01-01/enrollments/
  - https://developers.go1.com/api/rest/2025-01-01/files/
  - https://developers.go1.com/api/rest/2025-01-01/learning-objects/
  - https://developers.go1.com/api/rest/2025-01-01/plans/
  - https://developers.go1.com/api/rest/2025-01-01/play-links/
  - https://developers.go1.com/api/rest/2025-01-01/playlists/
  - https://developers.go1.com/api/rest/2025-01-01/portals/
  - https://developers.go1.com/api/rest/2025-01-01/restrictions/
  - https://developers.go1.com/api/rest/2025-01-01/scim/
  - https://developers.go1.com/api/rest/2025-01-01/user-accounts/
  - https://developers.go1.com/api/rest/2025-01-01/webhooks/
  x-assembled: '2026-10-21'
servers:
- url: https://gateway.go1.com
  description: Go1 API gateway (stated as the Base URL in the API reference overview)
tags:
- name: Files
  description: The File Upload endpoint allows users to upload and manage learning media within the Go1 ecosystem, including images, videos, audio files, documents, and SCORM packages. Uploaded files are securely stored and can be used for playback, embedding, or reference within learning content. Use this resource to upload new files, retrieve file details, and manage media assets for seamless content delivery.
  x-source: https://developers.go1.com/api/rest/2025-01-01/files/
paths:
  /files/upload-url:
    post:
      description: 'Create a unique URL that can be used to upload a file to the Go1 system.

        Note that the Content-Type header must be set to align with the method you are uploading.

        Eg: For uploading file with form data, you will need to set the header Content-Type: multipart/form-data.

        For more information, please refer to https://www.rfc-editor.org/rfc/rfc9110.html#name-content-type.'
      operationId: files-upload-url
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                file_name:
                  type: string
                  description: The name and extension of the file to upload. The format must be {name}.{extention}, eg. example.mp4. It does not need to match the original filename of the uploaded file, the extention must be lowercase.
                  example: example.mp4
                type:
                  type: string
                  description: 'The chosen file type determines supported mimetypes, maximum file size, and duration to expiry.Enum:

                    - invoice

                    - video

                    - expirable-assets'
                  enum:
                  - invoice
                  - video
                  - expirable-assets
              required:
              - file_name
      responses:
        '200':
          description: URL to upload a file has been successfully created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    description: The generated URL where the file content can be securely uploaded. Use this URL as the target to upload your file.
                    example: https://<domain>.com/pre-signed-url
                required:
                - url
        '400':
          description: Occurs when the request body fails validations.
        '401':
          description: Occurs when the request failed to provide a valid JWT.
        '403':
          description: Insufficient roles for this resource.
        '500':
          description: Occurs when a subsequent API call of Go1 internal services has fallen over.
      security:
      - bearer: []
      - OAuth2:
        - lo.write
      summary: Create a file upload URL
      tags:
      - Files
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth 2.0 via a Go1 Developer App (client_id/client_secret). See https://developers.go1.com/docs/developer-tools/auth/overview-auth
      flows:
        clientCredentials:
          tokenUrl: https://auth.go1.com/oauth/token
          scopes:
            enrollment.read: ''
            enrollment.write: ''
            group.read: ''
            group.write: ''
            lo.launch: ''
            lo.read: ''
            lo.write: ''
            plan.read: ''
            plan.write: ''
            portal.read: ''
            portal.write: ''
            user.login: ''
            user.read: ''
            user.write: ''
            webhook.read: ''
            webhook.write: ''
        authorizationCode:
          authorizationUrl: https://auth.go1.com/oauth/authorize
          tokenUrl: https://auth.go1.com/oauth/token
          scopes:
            enrollment.read: ''
            enrollment.write: ''
            group.read: ''
            group.write: ''
            lo.launch: ''
            lo.read: ''
            lo.write: ''
            plan.read: ''
            plan.write: ''
            portal.read: ''
            portal.write: ''
            user.login: ''
            user.read: ''
            user.write: ''
            webhook.read: ''
            webhook.write: ''
    bearer:
      type: http
      scheme: bearer
      description: Access token sent in the Authorization header (named "bearer" by some operations in the reference).
