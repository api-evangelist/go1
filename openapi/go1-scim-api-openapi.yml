openapi: 3.2.0
info:
  title: Go1 SCIM API
  version: '2025-01-01'
  description: Go1 REST API, version 2025-01-01, as published in the Go1 developer API reference. Every path operation is the provider's own OpenAPI operation object, copied verbatim from the endpoints data embedded in each reference page (__NEXT_DATA__ pageProps.endpoints) on developers.go1.com. The info, servers and securitySchemes envelope is assembled from the reference overview (base URL https://gateway.go1.com, Api-Version header) and the OAuth 2.0 grant guides (auth.go1.com token/authorize URLs); scope descriptions are left blank because the operations name scopes without describing them.
  contact:
    name: Go1 Developer Support
    url: https://developers.go1.com/
  x-assembled-from:
  - https://developers.go1.com/api/rest/2025-01-01/overview/
  - https://developers.go1.com/api/rest/2025-01-01/categories/
