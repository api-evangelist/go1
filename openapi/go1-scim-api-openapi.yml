                    description: The components of the user account's Go1 additional fields.
                  schemas:
                    description: The list of required schemas.
                    example:
                    - urn:ietf:params:scim:schemas:core:2.0:User
                    type: array
                    items:
                      type: string
                  id:
                    type: string
                    description: The unique identifier of the user account.
                    example: acc_01DRBZ0CR06CWKGDHR6WTKADHG
                  externalId:
                    type: string
                    description: A unique identifier for the user account as defined by the external provider.
                    example: 0a21f0f2-8d2a-4f8e-bf98-7363c4aed4ef
                  meta:
                    type: object
                    properties:
                      resourceType:
                        type: string
                        description: The resource type of the resource.
                        example: User
                      created:
                        format: date-time
                        type: string
                        description: The created date of the resource.
                      lastModified:
                        format: date-time
                        type: string
                        description: The last modified date of the resource.
                      location:
                        type: string
                        description: The SCIM ednpoint of the resource.
                      version:
                        type: string
                        description: The version of the resource.
                    required:
                    - resourceType
                    - created
                    - lastModified
                  userName:
                    type: string
                    description: The user account's unique username.
                    example: john.does@example.com
                  name:
                    description: The components of the user account's real name.
                    allOf:
                    - type: object
                      properties:
                        familyName:
                          type: string
                          description: The family name of the user account.
                          example: Doe
                        givenName:
                          type: string
                          description: The given name of the user account.
                          example: John
                      required:
                      - familyName
                      - givenName
                  locale:
                    type: string
                    description: The user account's locale.
                    example: en-US
                  active:
                    type: boolean
                    description: The user account's administrative status.
                    example: true
                  roleIds:
                    type: array
                    items:
                      type: string
                  displayName:
                    type: string
                    description: The user account's display name.
                    example: John Doe
                required:
                - schemas
                - meta
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                  status:
                    type: number
                  detail:
                    type: string
                  scimType:
                    type: string
                required:
                - schemas
                - status
              example:
                value:
                  schemas:
                  - urn:ietf:params:scim:api:messages:2.0:Error
                  detail: Authorization failure. Then authorization header is invalid or missing.
                  status: 401
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                  status:
                    type: number
                  detail:
                    type: string
                  scimType:
                    type: string
                required:
                - schemas
                - status
              example:
                value:
                  schemas:
                  - urn:ietf:params:scim:api:messages:2.0:Error
                  detail: Operation is not permitted based on the supplied authorization.
                  status: 403
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                  status:
                    type: number
                  detail:
                    type: string
                  scimType:
                    type: string
                required:
                - schemas
                - status
              example:
                value:
                  schemas:
                  - urn:ietf:params:scim:api:messages:2.0:Error
                  detail: Resource is not found.
                  status: 404
      tags:
      - SCIM
      security:
      - OAuth2:
        - user.read
