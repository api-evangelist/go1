- url: https://gateway.go1.com
  description: Go1 API gateway (stated as the Base URL in the API reference overview)
tags:
- name: SCIM
  description: The SCIM protocol is an application-level REST protocol for provisioning and managing identity data on the web. The protocol supports creation, discovery, retrieval, and modification of core identity resources.
  x-source: https://developers.go1.com/api/rest/2025-01-01/scim/
paths:
  /scim/Users/{id}:
    get:
      operationId: scimGetUser
      summary: Retrieve a user account
      description: Retrieves the details of a user account.
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      - name: attributes
        required: false
        in: query
        description: A list of attributes to include in the response. If not specified, all attributes are returned.
        schema:
          type: array
          items:
            type: string
      - name: excludedAttributes
        required: false
        in: query
        description: A list of attributes to exclude from the response. If not specified, all attributes are returned.
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  emails:
                    description: The user account's emails.
                    type: array
                    items:
                      type: object
                      properties:
                        value:
                          type: string
                          description: The email address of the user account.
                          example: john.doe@example.com
                        type:
                          type: string
                          description: The type of email.
                          example: work
                        primary:
                          type: boolean
                          description: A boolean value indicating whether the email is the primary email for the user account.
                          example: 'true'
                      required:
                      - value
                  roles:
                    description: The user account's roles.
                    type: array
                    items:
                      type: object
                      properties:
                        display:
                          type: string
                          description: The display name of the role.
                          example: John
                        type:
                          type: string
                          description: The type of the role.
                          example: Learner
                        primary:
                          type: boolean
                          description: The primary status of the role.
                          example: true
                        value:
                          type: string
                          description: 'List of available roles

                            - rol_01G3PZS7NZ0CF95J340P55FSZH: Learner,

                            - rol_01G3PZS7NZBW04V44QBM48PP0C: Manager,

                            - rol_01G3PZS7NY0579J21R4WB52HKJ: Assessor,

                            - rol_01G3PZS7NXC78RP57SG0EXD0Z5: Content administrator,

                            - rol_01G3PZS7NCBKB170TEP3CC2BBH: Administrator'
                          example: rol_01G3PZS7NZ0CF95J340P55FSZH
                      required:
                      - display
                      - value
                  groups:
                    description: The user account's groups.
                    type: array
                    items:
                      type: object
                      properties:
                        value:
                          type: string
                          description: The identifier of the group.
                          example: '1000'
                        $ref:
                          type: string
                          description: The URI of the group endpoint.
                          example: ../scim/Groups/1000
                        display:
                          type: string
                          description: The display name of the group.
                          example: My Group
                      required:
                      - value
                      - $ref
                  urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:
                    description: The components of the user account's enterprise user.
                    allOf:
                    - type: object
                      properties:
                        manager:
                          allOf:
                          - type: object
                            properties:
                              value:
                                type:
                                - string
                                - 'null'
                                description: The email address of the user's manager.
                                example: jane.doe@noemail.com
                              $ref:
                                type: string
                                description: The scim endpoint reference of the user's manager.
                                example: ../scim/Users/acc_01DRBZ0CR06CWKGDHR6WTKADHL
                              displayName:
                                type: string
                                description: The display name of the user's manager.
                                example: Jane Doe
                      required:
                      - manager
                  urn:ietf:params:scim:schemas:extension:Go1Account:2.0:User:
                    description: The components of the Go1 user account.
                    allOf:
                    - type: object
                      properties:
                        managers:
                          description: The user account's managers. Use this attribute to support multiple managers.
                          example:
                          - manager@email.com
                          - another_manager@email.com
                          type: array
                          items:
                            type: object
                            properties:
                              value:
                                type:
                                - string
                                - 'null'
                                description: The email address of the user's manager.
                                example: jane.doe@noemail.com
                              $ref:
                                type: string
                                description: The scim endpoint reference of the user's manager.
                                example: ../scim/Users/acc_01DRBZ0CR06CWKGDHR6WTKADHL
                              displayName:
                                type: string
                                description: The display name of the user's manager.
                                example: Jane Doe
                  urn:ietf:params:scim:schemas:extension:Go1StandardField:2.0:User:
                    description: The components of the user account's Go1 standard fields.
                    allOf:
                    - type: object
                      properties:
                        city:
                          type: string
                          description: The user account's city.
                          example: Sydney
                        state:
                          type: string
                          description: The user account's state.
                          example: NSW
                        country:
                          type: string
                          description: The user account's country.
                          example: Australia
                        phone:
                          type: string
                          description: The user account's phone number.
                          example: '0000000000'
                        language:
                          type: string
                          description: The user account's spoken language.
                          example: English
                        gender:
                          type: string
                          description: The user account's gender.
