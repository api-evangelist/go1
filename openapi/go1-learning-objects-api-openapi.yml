  /learning-objects:
    get:
      description: Returns a list of Learning Objects.
      operationId: learning-objects-v3-search
      parameters:
      - name: limit
        required: false
        in: query
        description: A limit on the number of objects to be returned, between 1 and 50. The default is 20. When `use_scroll` is activated, the maximum limit increases to 5000.
        schema:
          default: 20
          example: 20
          type: number
      - name: offset
        required: false
        in: query
        description: For use in pagination. The item number within a list request to start displaying results after. For example, a request with `limit=20` and `offset=20`, returns items 21 - 40. Note, pagination using the offset parameters cannot exceed 10,000 results.
        schema:
          example: 20
          type: number
      - name: keyword
        required: false
        in: query
        description: A search for Learning Objects based on one or more keywords.
        schema:
          example: Excel
          type: string
      - name: sort
        required: false
        in: query
        description: 'Sorts the results of your request by a given property.Enum:

          - `created`, sorts Learning Objects based on their creation date.

          - `popularity`, sorts Learning Objects based on total number of enrollments.

          - `price`, sorts Learning Objects based on their price.

          - `relevance`, sorts Learning Objects based on how relevant they are for you and your provided search terms and filters.

          - `title`, sorts Learning Objects alphabetical by their title.

          - `retired_time`, sorts Learning Objects based on the date they are scheduled for decommissioning. In [UTC timezone](https://en.wikipedia.org/wiki/Coordinated_Universal_Time), stored in [ISO 8601 format](https://en.wikipedia.org/wiki/ISO_8601).

          - `rating`, sorts Learning Objects based on their average user rating.

          - `updated_time`, sorts Learning Objects based on when they were last updated or modified.

          - `updated_media_time`, sorts Learning Objects based on when their media were last updated or modified.

          - `updated_metadata_time`, sorts Learning Objects based on when their metadata were last updated or modified.

          - `premium_submitted_time`, sorts Learning Objects based on their premium submitted time.

          - `premium_reviewed_time`, sorts Learning Objects based on their premium reviewed time.


          If used with the ''keyword'' parameter, the default sort order is by relevance. Otherwise, the default sort order is by title (alphabetical order).To sort by multiple properties, send comma-separated values, for example: `sort=price,title`. This will sort the Learning Objects by price first, then by title.'
        schema:
          example: created
          type: string
          enum:
          - created
          - popularity
          - price
          - relevance
          - title
          - retired_time
          - rating
          - updated_time
          - premium_submitted_time
          - premium_reviewed_time
          - updated_media_time
          - updated_metadata_time
      - name: order
        required: false
        in: query
        description: 'Orders the results by a given direction. Enum: `asc`, `desc`. The default value is descending. To order multiple sort properties, send comma-separated values, for example: `order=asc,desc`. Must be used with the ‘sort’ parameter.'
        schema:
          default: desc
          example: asc
          type: string
          enum:
          - asc
          - desc
      - name: collection
        required: false
        in: query
        description: 'Returns Learning Objects base on given collection. Enum: `library`, `not_added_to_library`, `partner_content`, `subscribe`. Examples:- `collection=subscribe`. Returns Learning Objects that are available on this Portal.- `collection=library`. Returns Learning Objects that are added in the user''s library.- `collection=not_added_to_library`. Returns Learning Objects that have not been added to the user''s library.- `collection=partner_content`. Returns Partner Content Learning Objects available to the user.'
        schema:
          example: library
          type: string
          enum:
          - library
          - not_added_to_library
          - partner_content
          - subscribe
      - name: providers[]
        required: false
        in: query
        description: Filters Learning Objects by provider, specified by the provider ID. Examples:- `providers[]=150`, returns Learning Objects by provider `#150`.- `providers[]=150&providers[]2000`, returns Learning Objects by provider `#150` and provider `#2000`.
        schema:
          type: array
          items:
            type: string
      - name: entry_level[]
        required: false
        in: query
        description: 'Filters Learning Objects by entry level. Enum: `beginner`, `intermediate`, `advanced`, `anyone`. Examples:- `entry_level[]=beginner`, returns Learning Objects where entry level is `beginner`.- `entry_level[]=beginner&entry_level[]=anyone`, returns Learning Objects where entry level is `intermediate` or `anyone`.'
        schema:
          example: advanced
          type: array
          items:
            type: string
            enum:
            - beginner
            - intermediate
            - advanced
            - anyone
      - name: language[]
        required: false
        in: query
        description: Filters Learning Objects by language, and optionally locale. Accepts two-letter [ISO 639-1](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes) codes for languages in lowercase, and optionally two-letter [ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) codes for countries in lowercase, separated by a hyphen. Examples:- `language[]=en-us`, returns Learning Objects where the language is English (United States).- `language[]=en-gb`, returns Learning Objects where the language is English (United Kingdom).- `language[]=es&language[]=sv`, returns Learning Objects where the language is Spanish or Swedish.
        schema:
          type: array
          items:
            type: string
      - name: language_op
        required: false
        in: query
        description: 'Language search operation, used in combination with the `language` parameter. Enum: `or`, `and`. The default is `or`. Examples:- `language_op=or`. Returns Learning Objects available in ANY of the specified languages (default behavior).- `language_op=and`. Returns Learning Objects available in ALL of the specified languages.- `language[]=en&language[]=fr`. Returns Learning Objects available in either English or French.- `language_op=and&language[]=en&language[]=fr`. Returns Learning Objects available in both English and French.'
        schema:
          default: or
          example: or
          type: string
          enum:
          - and
          - or
      - name: mobile_friendly
        required: false
        in: query
        description: Filters learning objects that are optimised for mobile playback.
        schema:
          example: mobile_friendly=true
          type: boolean
      - name: region_relevance[]
        required: false
        in: query
        description: 'Filters Learning Objects by region relevance. Region values include: `GLOBAL`, `MY`, `UAE`, `US`, `AU`, `NZ`, `CA`, `GB`, `ZA`. Examples:- `region_relevance[]=AU`, returns Learning Objects relevant to `AU`.- `region_relevance[]=AU&region_relevance[]=GLOBAL`, returns Learning Objects relevant to `AU` and `GLOBAL`.'
        schema:
          example: AU
          type: array
          items:
            type: string
            enum:
            - GLOBAL
            - MY
            - UAE
            - US
            - AU
            - NZ
            - CA
            - GB
            - ZA
      - name: locale[]
        required: false
        in: query
        description: "Filters Learning Objects by locale. Locale values include:\n `en-AU`, `en-US`, `en-UK`. Examples:\n- `locale[]=en-AU`, returns Learning Objects relevant to `en-AU`.\n- `locale[]=en-AU&locale[]=en-US`, returns Learning Objects relevant to `en-AU` and `en-US`."
        schema:
          example: en-AU
          type: array
          items:
            type: string
            enum:
            - en-AU
            - en-US
            - en-UK
      - name: duration[][]
        required: false
        in: query
        description: Filters Learning Objects by a duration range. Will return Learning Objects with the specified duration or longer. Examples:- `duration[0][min]=0&duration[0][max]=15&duration[1][min]=60`, returns Learning Objects with the duration between 0 and 15 minutes, or greater than or equal to 60 minutes.- `duration[][max]=60`, returns Learning Objects with the duration less than or equal to 60 minutes.
        schema:
          type: array
          items:
            type: string
      - name: skills[]
        required: false
        in: query
        description: 'Filters Learning Objects by skills they are associated with. Examples:- `skills[]=excel`, returns Learning Objects associated with the skill `excel`.- `skills[]=mathematics&skills[]=leadership`, returns Learning Objects associated with the skills `mathematics`, `leadership`, or both. '
        schema:
          type: array
          items:
            type: string
      - name: topics[]
        required: false
        in: query
        description: Filters Learning Objects by topic. Examples:- `topics[]=sales`, returns Learning Objects associated with the topic `sales`.- `topics[]=leadership&topics[]=sales`, returns Learning Objects associated with the topic `sales`, `leadership`, or both.
        schema:
          type: array
          items:
            type: string
      - name: tags[]
        required: false
        in: query
        description: Filters Learning Objects by tags. Examples:- `tags[]=Agile`, returns Learning Objects that are tagged with `Agile`.- `tags[]=Agile&tags[]=Business Skills`, returns Learning Objects that are tagged with `Agile`, `Business Skills`, or both.
        schema:
          type: array
          items:
            type: string
      - name: type[]
        required: false
        in: query
        description: 'Filters Learning Objects by type. Enum: `course`, `playlist`, `document`, `link`, `interactive`, `text`, `video`, `audio`, `award`. Examples:- `type[]=course`, returns `course` type Learning Objects.- `type[]=video`, returns `video` type Learning Objects.- `type[]=course&type[]=video`, returns `course` and `video` type Learning Objects.'
        schema:
          example: interactive
          type: array
          items:
            type: string
            enum:
            - course
            - playlist
            - document
            - link
            - interactive
            - text
            - video
            - audio
            - award
      - name: facets[]
        required: false
        in: query
        description: "The facets[] query parameter allows you to request facets to be included in the API response. Facets represent sets of data associated with a queried list of Learning Objects, often used to display filtering options in a search interface. Enum:\n  * `providers`\n  * `language`\n  * `mobile_friendly`\n  * `region_relevance`\n  * `topics`\n  * `duration`\n  * `entry_level`\n  * `type`\n  * `locale`\n  * `is_compliance`\n  * `restricted_categories`\n  * `five_star_rating`\n  * `categories`\n  * `accessibility_wcag_level`\n  * `accessibility_features`"
        schema:
          example: duration
          type: array
          items:
            type: string
            enum:
            - providers
            - language
            - mobile_friendly
            - region_relevance
            - topics
            - duration
            - duration_granular
            - entry_level
            - type
            - locale
            - regulations
            - is_compliance
            - restricted_categories
            - five_star_rating
            - categories
            - accessibility_wcag_level
            - accessibility_features
      - name: id[]
        required: false
        in: query
        description: Filters Learning Objects by id.
        schema:
          type: array
          items:
            type: string
      - name: state[]
        required: false
        in: query
        description: 'Filter Learning Objects of specific lifecycle states. If no `state[]` is passed, it defaults to `published`. Note, only `draft` and `published` states can be filtered in the same request. To filter by `retired` or `removed` states, make separate requests. '
        schema:
          default: published
          example: retired
          type: array
          items:
            type: string
            enum:
            - draft
            - published
            - retired
            - removed
      - name: created_time[]
        required: false
        in: query
        description: 'Filters Learning Objects by their `created_time` time in ISO-8601 format. Use it to identify Learning Objects that were created recently.




          - `[min]` will match all records *greater than or equal to* this date


          - `[max]` will match all records *less than or equal to* this date





          Examples:




          - `created_time[min]=2024-07-01` – Returns all Learning Objects created after July 1st, 2024


          - `created_time[min]=2024-01-01&created_time[max]=2024-06-30` – Returns all Learning Objects created between January 1st, 2024 and June 30th, 2024


          - `created_time[max]=2022-01-01` – Returns all Learning Objects that were created prior to January 1st, 2022'
        schema:
          type: array
          items:
            type: string
      - name: updated_time[]
        required: false
        in: query
        description: 'Filters Learning Objects by their `updated_time` time in ISO-8601 format. Use it to identify Learning Objects that were updated recently.




          - `[min]` will match all records *greater than or equal to* this date


          - `[max]` will match all records *less than or equal to* this date





          Examples:




          - `updated_time[min]=2024-07-01` – Returns all Learning Objects updated after July 1st, 2024


          - `updated_time[min]=2024-01-01&updated_time[max]=2024-06-30` – Returns all Learning Objects updated between January 1st, 2024 and June 30th, 2024


          - `updated_time[max]=2022-01-01` – Returns all Learning Objects that haven’t been updated since January 1st, 2022'
        schema:
          type: array
          items:
