          - `retired_time[min]=2024-07-01` – Returns all Learning Objects retired after July 1st, 2024


          - `retired_time[min]=2024-01-01&retired_time[max]=2024-06-30` – Returns all Learning Objects retired between January 1st, 2024 and June 30th, 2024


          - `retired_time[max]=2022-01-01` – Returns all Learning Objects that were retired prior to January 1st, 2022'
        schema:
          type: array
          items:
