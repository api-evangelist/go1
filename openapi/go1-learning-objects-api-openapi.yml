          - `updated_media_time[min]=2024-01-01&updated_media_time[max]=2024-06-30` – Returns all Learning Objects that had its media updated between January 1st, 2024 and June 30th, 2024


          - `updated_media_time[max]=2022-01-01` – Returns all Learning Objects that haven''t had their media updated since January 1st, 2022'
