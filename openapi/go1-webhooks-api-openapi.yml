openapi: 3.2.0
info:
  title: Go1 Webhooks API
  version: '2025-01-01'
  description: Go1 REST API, version 2025-01-01, as published in the Go1 developer API reference. Every path operation is the provider's own OpenAPI operation object, copied verbatim from the endpoints data embedded in each reference page (__NEXT_DATA__ pageProps.endpoints) on developers.go1.com. The info, servers and securitySchemes envelope is assembled from the reference overview (base URL https://gateway.go1.com, Api-Version header) and the OAuth 2.0 grant guides (auth.go1.com token/authorize URLs); scope descriptions are left blank because the operations name scopes without describing them.
  contact:
    name: Go1 Developer Support
    url: https://developers.go1.com/
  x-assembled-from:
  - https://developers.go1.com/api/rest/2025-01-01/overview/
  - https://developers.go1.com/api/rest/2025-01-01/categories/
  - https://developers.go1.com/api/rest/2025-01-01/collections/
  - https://developers.go1.com/api/rest/2025-01-01/compliance/
  - https://developers.go1.com/api/rest/2025-01-01/enrollments/
  - https://developers.go1.com/api/rest/2025-01-01/files/
  - https://developers.go1.com/api/rest/2025-01-01/learning-objects/
  - https://developers.go1.com/api/rest/2025-01-01/plans/
  - https://developers.go1.com/api/rest/2025-01-01/play-links/
  - https://developers.go1.com/api/rest/2025-01-01/playlists/
  - https://developers.go1.com/api/rest/2025-01-01/portals/
  - https://developers.go1.com/api/rest/2025-01-01/restrictions/
  - https://developers.go1.com/api/rest/2025-01-01/scim/
  - https://developers.go1.com/api/rest/2025-01-01/user-accounts/
  - https://developers.go1.com/api/rest/2025-01-01/webhooks/
  x-assembled: '2026-10-21'
servers:
- url: https://gateway.go1.com
  description: Go1 API gateway (stated as the Base URL in the API reference overview)
tags:
- name: Webhooks
  description: 'Webhooks can be configured via the API to notify your application when a notable events take place in your Go1 portal or your connected customer portals, for example when an enrollment occurs, or when a user is updated. Events are sent to an endpoint URL that is specified by you when creating a new webhook.


    Use this resource to create, retrieve and update webhooks. For a list of webhook events, including more information about each event, see the Webhook events resource section.'
  x-source: https://developers.go1.com/api/rest/2025-01-01/webhooks/
paths:
  /webhooks:
    get:
      security:
      - OAuth2:
        - webhook.read
      operationId: WebhookController_getPortalWebhookConfiguration
      summary: List all webhooks
      description: Returns a list of your webhooks.
      responses:
        '200':
          description: Returns a list of webhooks
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                    example: '1'
                    description: The number of webhooks contained in the response.
                  hits:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: xUjKifleke4u
                          description: The ID of the webhook configuration.
                        portal_id:
                          type: string
                          example: '11905591'
                          description: The Go1 portal against which the webhook is configured.
                        name:
                          type: string
                          example: My webhook description
                          description: A name or description of what the webhook is used for.
                        url:
                          type: string
                          example: https://webhook-consumer.com
                          description: The URL of the webhook endpoint.
                        secret_key:
                          type: string
                          example: MyS3cretK#y
                          description: An optional shared secret to identify each webhook as a trusted Go1 event.
                        event_types:
                          type: array
                          example:
                          - enrollment.complete
                          - enrollment.create
                          - content.decommission
                          - content.decommission.pending
                          - content.add
                          - content.remove
                          - content.library.sync.request
                          description: The list of events that are enabled for this endpoint.
                          items:
                            type: string
                            enum:
                            - enrollment.complete
                            - enrollment.create
                            - content.decommission
                            - content.decommission.pending
                            - content.add
                            - content.remove
                            - content.library.sync.request
                        status:
                          type: string
                          example: active
                          description: The status of the webhook. It can be active or inactive.
                        created_by:
                          type: string
                          example: '19491473'
                          description: The user ID of the user who created the webhook.
                        created_time:
                          type: string
                          format: date-time
                          example: '2022-03-29T01:29:36.000Z'
                          description: Time at which the webhook was created (ISO 8601 in UTC).
                        updated_by:
                          type: string
                          example: '19491473'
                          description: The user ID of the user who last updated the webhook.
                        updated_time:
                          type: string
                          format: date-time
                          example: '2022-03-29T01:29:36.000Z'
                          description: Time at which the webhook was last updated (ISO 8601 in UTC).
                        auth_type:
                          type: string
                          example: oauth2
                          description: The type of authentication used when setting up webhook authentication with an external auth system.
                        oauth2:
                          type: object
                          example: '{"grant_type":"client_credentials","client_id":"123456789123456789","client_secret":"ThisIsMySecret","authentication_server_url":"https://authentication-service.com/oauth/token","scope":"create+delete"}'
                          description: The oauth2 parameters required to authenticate a webhook with an external system. This parameter should be supplied along with the auth_type field, where it contains a value of oauth2.
                        integration_system_id:
                          type: string
                          example: int_AzuTsRz
                          description: A unique ID assigned to an external system that integrates with Go1. When using the `content.library.sync.request` webhook event, the `integration_system_id` is required to identify which system the event should apply to.
                      required:
                      - id
                      - url
                      - event_types
                      - status
                      - created_by
                      - created_time
                      - updated_by
                      - updated_time
                    description: The list of webhooks.
                required:
                - total
                - hits
        '401':
          description: User is unauthenticated.
        '403':
          description: User is not authorized.
        '500':
          description: Server error.
      tags:
      - Webhooks
    post:
      security:
      - OAuth2:
        - webhook.write
      operationId: WebhookController_createPortalWebhookConfiguration
      summary: Create a webhook
      description: Creates a new webhook that will fire events to the given url.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: My webhook description
                  description: A name or description of what the webhook is used for.
                url:
                  type: string
                  example: https://webhook-consumer.com
                  description: The URL of the webhook endpoint.
                secret_key:
                  type: string
                  example: MyS3cretK#y
                  description: An optional secret key, identifying each event as coming from a trusted Go1 source.
                event_types:
                  type: array
                  example:
                  - enrollment.complete
                  - enrollment.create
                  - enrollment.delete
                  - content.decommission
                  - content.decommission.pending
                  - content.add
                  - content.remove
                  - content.library.sync.request
                  - content.library.add
                  - content.library.remove
                  - content.library.update
                  - content.library.decommission
                  description: The list of events to enable for this webhook.
                  items:
                    type: string
                    enum:
                    - enrollment.complete
                    - enrollment.create
                    - enrollment.delete
                    - content.decommission
                    - content.decommission.pending
                    - content.add
                    - content.remove
                    - content.library.sync.request
                    - content.library.add
                    - content.library.remove
                    - content.library.update
                    - content.library.decommission
                auth_type:
                  type: string
                  example: oauth2
                  description: The type of authentication used when setting up webhook authentication with an external auth system.
                oauth2:
                  type: object
                  example: '{"grant_type":"client_credentials","client_id":"123456789123456789","client_secret":"ThisIsMySecret","authentication_server_url":"https://authentication-service.com/oauth/token","scope":"create+delete"}'
                  description: The oauth2 parameters required to authenticate a webhook with an external system. This parameter should be supplied along with the auth_type field, where it contains a value of oauth2.
                integration_system_id:
                  type: string
                  example: int_AzuTsaz
                  description: A unique ID assigned to an external system that integrates with Go1. When using the `content.library.sync.request` webhook event, the `integration_system_id` is required to identify which system the event should apply to.
              required:
              - url
              - event_types
      responses:
        '201':
          description: Webhook created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: xUjKifleke4u
                    description: The ID of the webhook configuration.
                  portal_id:
                    type: string
                    example: '11905591'
                    description: The Go1 portal against which the webhook is configured.
                  name:
                    type: string
                    example: My webhook description
                    description: A name or description of what the webhook is used for.
                  url:
                    type: string
                    example: https://webhook-consumer.com
                    description: The URL of the webhook endpoint.
                  secret_key:
                    type: string
                    example: MyS3cretK#y
                    description: An optional shared secret to identify each webhook as a trusted Go1 event.
                  event_types:
                    type: array
                    example:
                    - enrollment.complete
                    - enrollment.create
                    - content.decommission
                    - content.decommission.pending
                    - content.add
                    - content.remove
                    - content.library.sync.request
                    description: The list of events that are enabled for this endpoint.
                    items:
                      type: string
                      enum:
                      - enrollment.complete
                      - enrollment.create
                      - content.decommission
                      - content.decommission.pending
                      - content.add
                      - content.remove
                      - content.library.sync.request
                  status:
                    type: string
                    example: active
                    description: The status of the webhook. It can be active or inactive.
                  created_by:
                    type: string
                    example: '19491473'
                    description: The user ID of the user who created the webhook.
                  created_time:
                    type: string
                    format: date-time
                    example: '2022-03-29T01:29:36.000Z'
                    description: Time at which the webhook was created (ISO 8601 in UTC).
                  updated_by:
                    type: string
                    example: '19491473'
                    description: The user ID of the user who last updated the webhook.
                  updated_time:
                    type: string
                    format: date-time
                    example: '2022-03-29T01:29:36.000Z'
                    description: Time at which the webhook was last updated (ISO 8601 in UTC).
                  auth_type:
                    type: string
                    example: oauth2
                    description: The type of authentication used when setting up webhook authentication with an external auth system.
                  oauth2:
                    type: object
                    example: '{"grant_type":"client_credentials","client_id":"123456789123456789","client_secret":"ThisIsMySecret","authentication_server_url":"https://authentication-service.com/oauth/token","scope":"create+delete"}'
                    description: The oauth2 parameters required to authenticate a webhook with an external system. This parameter should be supplied along with the auth_type field, where it contains a value of oauth2.
                  integration_system_id:
                    type: string
                    example: int_AzuTsRz
                    description: A unique ID assigned to an external system that integrates with Go1. When using the `content.library.sync.request` webhook event, the `integration_system_id` is required to identify which system the event should apply to.
                required:
                - id
                - url
                - event_types
                - status
                - created_by
                - created_time
                - updated_by
                - updated_time
        '400':
          description: Invalid POST parameters provided.
        '403':
          description: Invalid permission to create the webhook.
      tags:
      - Webhooks
  /webhooks/{id}:
    patch:
      security:
      - OAuth2:
        - webhook.write
      operationId: WebhookController_updatePortalWebhookConfiguration
      summary: Update a webhook
      description: 'Updates any of the following fields on an existing webhook: name, url, secret_key, event_types and status.'
