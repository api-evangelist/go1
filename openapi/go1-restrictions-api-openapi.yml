            group.read: ''
            group.write: ''
            lo.launch: ''
            lo.read: ''
            lo.write: ''
            plan.read: ''
            plan.write: ''
            portal.read: ''
            portal.write: ''
            user.login: ''
            user.read: ''
            user.write: ''
            webhook.read: ''
            webhook.write: ''
        authorizationCode:
          authorizationUrl: https://auth.go1.com/oauth/authorize
          tokenUrl: https://auth.go1.com/oauth/token
          scopes:
            enrollment.read: ''
            enrollment.write: ''
            group.read: ''
            group.write: ''
            lo.launch: ''
            lo.read: ''
            lo.write: ''
            plan.read: ''
            plan.write: ''
            portal.read: ''
            portal.write: ''
            user.login: ''
