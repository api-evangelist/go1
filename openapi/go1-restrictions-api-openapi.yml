servers:
- url: https://gateway.go1.com
  description: Go1 API gateway (stated as the Base URL in the API reference overview)
tags:
- name: Restrictions
  description: The Restrictions service provides APIs for managing restrictions on learning objects, including access control and visibility settings.
  x-source: https://developers.go1.com/api/rest/2025-01-01/restrictions/
paths:
  /restrictions:
    post:
      description: Create restriction configurations that will be applied for blacklisting content access through portal search.
      operationId: post-restriction-create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                restriction:
                  description: The configuration object contains all the restricted configurations
                  allOf:
                  - type: object
                    properties:
                      categories:
                        description: An array containing the categories that will be used to restrict content discovery.
                        type: array
                        items:
                          type: string
                      providers:
                        description: A list of identifiers for the content provider portals that will be used to restrict content discovery.
                        type: array
                        items:
                          type: string
                    required:
                    - categories
                    - providers
      responses:
        '201':
          description: Restriction has been successfully created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The unique identifier for the restriction configuration.
                  entity_type:
                    type: string
                    description: "The type of the entity the restriction is applied \n\n Enum:\n- portal"
                    enum:
                    - portal
                  entity_id:
                    type: string
                    description: The identifier of the entity affected by the restriction.
                  restriction:
                    description: The configuration object contains all the restricted configurations
                    allOf:
                    - type: object
                      properties:
                        categories:
                          description: An array containing the categories that will be used to restrict content discovery.
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: The unique identifier for each category item.
                              name:
                                type: string
                                description: The name of each category item.
                            required:
                            - id
                            - name
                        providers:
                          description: A list of identifiers for the content provider portals that will be used to restrict content discovery.
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: The unique identifier for each content provider portal item.
                              name:
                                type: string
                                description: The name of each content provider portal item.
                            required:
                            - id
                            - name
                      required:
                      - categories
                      - providers
                required:
                - id
                - entity_type
                - entity_id
        '401':
          description: The resource owner or authorization server denied the request.
        '403':
          description: Insufficient permission to perform this operation.
        '500':
          description: Internal server error
      security:
      - bearer: []
      - OAuth2:
        - portal.write
      summary: Create a restriction configurations
      tags:
      - Restrictions
    get:
      description: Return a list of restriction configurations for that will be apply for blacklisting content access through search in a portal.
      operationId: list-restrictions
      parameters: []
      responses:
        '200':
          description: Returns a list of restrictions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                    description: Total number of restriction configurations that applied for the current logged-in user
                  hits:
                    description: An array of Objects representing the restricted configurations.
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The unique identifier for the restriction configuration.
                        restriction:
                          description: The configuration object contains all the restricted configurations
                          allOf:
                          - type: object
                            properties:
                              categories:
                                description: An array containing the categories that will be used to restrict content discovery.
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                      description: The unique identifier for each category item.
                                    name:
                                      type: string
                                      description: The name of each category item.
                                  required:
                                  - id
                                  - name
                              providers:
                                description: A list of identifiers for the content provider portals that will be used to restrict content discovery.
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                      description: The unique identifier for each content provider portal item.
                                    name:
                                      type: string
                                      description: The name of each content provider portal item.
                                  required:
                                  - id
                                  - name
                            required:
                            - categories
                            - providers
                      required:
                      - id
                required:
                - total
                - hits
        '401':
          description: The resource owner or authorization server denied the request.
        '403':
          description: Insufficient permission to perform this operation.
        '500':
          description: Internal server error
      security:
      - bearer: []
      - OAuth2:
        - portal.read
      summary: List restrictions
      tags:
      - Restrictions
  /restrictions/{id}:
    put:
      description: Updates restrictions that will be applied for blacklisting content access through portal search.
      operationId: put-restriction-update
      parameters:
      - name: id
        required: true
        in: path
        description: The unique identifier for the restriction
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                restriction:
                  description: The configuration object contains all the restricted configurations
                  allOf:
                  - type: object
                    properties:
                      categories:
                        description: An array containing the categories that will be used to restrict content discovery.
                        type: array
                        items:
                          type: string
                      providers:
                        description: A list of identifiers for the content provider portals that will be used to restrict content discovery.
                        type: array
                        items:
                          type: string
                    required:
                    - categories
                    - providers
      responses:
        '204':
          description: The restriction configuration is updated successfully.
        '401':
          description: The resource owner or authorization server denied the request.
        '403':
          description: Insufficient permission to perform this operation.
        '404':
          description: Restriction not found
        '500':
          description: Internal server error
      security:
      - bearer: []
      - OAuth2:
        - portal.write
      summary: Update a restriction configurations
      tags:
      - Restrictions
