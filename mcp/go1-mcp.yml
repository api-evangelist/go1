tools:
- name: search_content
  description: Search the Go1 catalogue by keyword, with optional filters for duration, level, language, content
    provider, and skill. Returns course titles, descriptions, and direct links.
  source: documented
  evidence_url: https://help.go1.com/en/articles/15469776-connecting-to-the-go1-mcp-server
- name: get_content_facets
  description: Returns a breakdown of available filters for a given search — including languages, content providers,
    and skill tags.
  source: documented
  evidence_url: https://help.go1.com/en/articles/15469776-connecting-to-the-go1-mcp-server
- name: suggest_skills
  description: Returns skill recommendations based on a role title or topic, for use as filter inputs when searching
    for learning content.
  source: documented
  evidence_url: https://help.go1.com/en/articles/15469776-connecting-to-the-go1-mcp-server
- name: get_playlist_details
  description: Retrieves the full ordered contents of a curated Go1 learning playlist, including titles, durations,
    providers, and links for each item.
  source: documented
  evidence_url: https://help.go1.com/en/articles/15469776-connecting-to-the-go1-mcp-server
- name: get_content_alternatives
  description: Suggests alternative learning content for a specific item that has been decommissioned, given the
    ID of the original item.
  source: documented
  evidence_url: https://help.go1.com/en/articles/15469776-connecting-to-the-go1-mcp-server
workflows_documented:
- 'Finding courses for a topic: get_content_facets then search_content (limit 10-20)'
- 'Recommending skills for a role: suggest_skills then search_content filtered by the returned skills'
- 'Surfacing a curated playlist: search_content or known playlist ID, then get_playlist_details'
