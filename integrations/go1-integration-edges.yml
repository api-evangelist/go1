skips:
- label: Stripe (Legacy)
  cause: provider-contract
  why: Go1 exposes no payment/billing-event operation that a Stripe charge or customer could feed beyond portal
    plans, which are partner-provisioning, not customer billing.
- label: Facebook Lead Ads (for Business admins)
  cause: provider-contract
  why: No Go1 lead/contact operation; creating a learner account from an ad lead is not a market-proven Go1 workflow
    and no template was listed.
- label: GoTo Webinar
  cause: catalog
  why: Paired app only; no template on the listing and no clear GoTo Webinar operation mapping to Go1 enrollments
    in the held spec chosen this run.
- label: Google Docs
  cause: provider-contract
  why: Go1 exposes no document/report export operation to write into a Doc.
- label: Google Ads
  cause: provider-contract
  why: No Go1 operation corresponds to ad conversions or audiences.
- label: Anthropic (Claude)
  cause: catalog
  why: Pairing is a generic AI step on Zapier; no template and no concrete Go1-side workflow to recreate.
- label: Facebook Conversions (for Business admins)
  cause: provider-contract
  why: No Go1 operation corresponds to conversion events.
- label: Submittable
  cause: catalog
  why: No template on the listing; Submittable submission operations were not mapped this run (not attempted, not
    a provider gap).
- label: Typeform Enterprise (EU)
  cause: partner-contract
  why: The catalog Typeform spec holds forms/images/themes only, no responses operation to read submissions from.
- label: eBay
  cause: provider-contract
  why: No Go1 operation maps to marketplace orders or listings.
